<!DOCTYPE html>
<html>

<head>

    <title>Attack History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h1>Attack History</h1>

    <hr>

    <table class="table table-dark table-bordered">

        <thead>

        <tr>

            <th>ID</th>
            <th>IP Address</th>
            <th>Requests</th>
            <th>Protocol</th>
            <th>Risk</th>
            <th>Status</th>
            <th>Time</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        {% for attack in attacks %}

        <tr>

            <td>{{ attack[0] }}</td>
            <td>{{ attack[1] }}</td>
            <td>{{ attack[2] }}</td>
            <td>{{ attack[3] }}</td>
            <td>{{ attack[4] }}</td>
            <td>{{ attack[5] }}</td>
            <td>{{ attack[6] }}</td>

<td>
    <a
        href="/block_ip/{{ attack[1] }}"
        class="btn btn-danger btn-sm">
        Block
    </a>
</td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

    <a href="/dashboard" class="btn btn-primary">
        Back To Dashboard
    </a>

</div>

</body>
</html>
