<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shield Cloud Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #1f252d;
            color: white;
        }

        .card-stat {
            border: none;
            border-radius: 12px;
        }

        .upload-card {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <h1>Welcome, {{ user }}</h1>

    <hr>

    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card bg-primary text-white card-stat">
                <div class="card-body">
                    <h5>Total Analyses</h5>
                    <h2>{{ total_analyses }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-danger text-white card-stat">
                <div class="card-body">
                    <h5>Total Attacks</h5>
                    <h2>{{ total_attacks }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-success text-white card-stat">
                <div class="card-body">
                    <h5>Blocked IPs</h5>
                    <h2>{{ blocked_ips }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card upload-card p-4 text-dark mb-4">

        <h3>Upload Traffic Log</h3>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <input
                type="file"
                name="file"
                class="form-control mb-3"
                accept=".csv"
                required>

            <button class="btn btn-primary">
                Upload File
            </button>

        </form>

    </div>

    <div class="mb-5">

        <a href="/attack_history" class="btn btn-danger me-2">
            View Attack History
        </a>

        <a href="/logout" class="btn btn-warning">
            Logout
        </a>

    </div>

</div>

</body>
</html>
